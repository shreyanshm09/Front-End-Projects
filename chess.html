  <meta charset="UTF-8">

  <title>Chess Board</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }

    /* Outer boundary */
    .board-frame {
      padding: 18px;
      background: #000;
      border: 6px solid #222;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Chess board */
    .chess-board {
      width: 640px;
      height: 640px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 3px solid #000;
    }

    .square {
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 58px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .white {
      background: #fff;
    }

    .black {
      background: #000;
    }

    /* White chess pieces */
    .white-piece {
      color: #fff;
      text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
    }

    /* Black chess pieces */
    .black-piece {
      color: #000;
      text-shadow:
        1px 1px 0 #fff,
        -1px -1px 0 #fff;
    }

    .square:hover {
      outline: 3px solid #888;
      outline-offset: -3px;
    }

    /* Responsive */
    @media (max-width: 750px) {
      .board-frame {
        padding: 10px;
      }

      .chess-board {
        width: 90vw;
        height: 90vw;
      }

      .square {
        width: calc(90vw / 8);
        height: calc(90vw / 8);
        font-size: 7vw;
      }
    }
  </style>
</head>
