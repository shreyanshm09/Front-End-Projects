<!DOCTYPE html>
<html lang="en">
<head>
    <title>Facebook – log in</title>
</head>
<body>

    <!-- Branding -->
    <h1 style="color: #1877f2; font-family: sans-serif;">facebook</h1>

    <!-- Login Form -->
    <form action="/login" method="POST">
        <p>
            <input type="text" name="email" placeholder="Email or phone number" required>
        </p>
        <p>
            <input type="password" name="pass" placeholder="Password" required>
        </p>
        <p>
            <button type="submit" style="background-color: #1877f2; color: white;">Log In</button>
        </p>
        <p>
            <a href="#">Forgotten password?</a>
        </p>
        <hr align="left" width="200">
        <p>
            <button type="button" style="background-color: #42b72a; color: white;">Create new account</button>
        </p>
    </form>

</body>
</html>
