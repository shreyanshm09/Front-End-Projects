```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #262626;
    }

    .container {
      width: 350px;
    }

    .login-box {
      background: white;
      border: 1px solid #dbdbdb;
      padding: 40px 40px 25px;
      text-align: center;
    }

    .logo {
      font-family: cursive;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .input {
      width: 100%;
      height: 38px;
      margin-bottom: 7px;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background: #fafafa;
      font-size: 12px;
      outline: none;
    }

    .input:focus {
      border-color: #999;
    }

    .login-btn {
      width: 100%;
      height: 32px;
      margin-top: 8px;
      border: none;
      border-radius: 7px;
      background: #0095f6;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1877f2;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 25px 0;
      color: #737373;
      font-size: 13px;
      font-weight: bold;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dbdbdb;
      flex: 1;
    }

    .facebook {
      color: #385185;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .forgot {
      color: #00376b;
      font-size: 12px;
      text-decoration: none;
    }

    .signup-box {
      background: white;
      border: 1px solid #dbdbdb;
      margin-top: 10px;
      padding: 22px;
      text-align: center;
      font-size: 14px;
    }

    .signup-box a {
      color: #0095f6;
      font-weight: bold;
      text-decoration: none;
    }

    .disclaimer {
      text-align: center;
      color: #737373;
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.5;
    }

    @media (max-width: 450px) {
      body {
        background: white;
      }

      .container {
        width: 100%;
      }

      .login-box,
      .signup-box {
        border: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-box">

      <div class="logo">Instagram</div>

      <form>
        <input
          type="text"
          class="input"
          placeholder="Phone number, username, or email"
        >

        <input
          type="password"
          class="input"
          placeholder="Password"
        >

        <button type="submit" class="login-btn">
          Log in
        </button>
      </form>

      <div class="divider">
        OR
      </div>

      <div class="facebook">
        ● Log in with Facebook
      </div>

      <a href="#" class="forgot">
        Forgot password?
      </a>

    </div>

    <div class="signup-box">
      Don't have an account?
      <a href="#">Sign up</a>
    </div>

    <div class="disclaimer">
      This is an educational UI recreation and is not affiliated with Instagram.
    </div>

  </div>

</body>
</html>
```
